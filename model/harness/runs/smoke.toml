# The harness end to end in a few minutes: three short seeds (more jobs than free cards, so
# one queues), small probes, exports. Proves the plumbing, not a model: every row may FAIL.

model = "l1-14m"
dataset = "l1-focus2"
iters = 300
batch = 64
lr = 6e-4
seeds = [1, 2, 3]
mode = "opportunistic"
cpu = false
export = true

[[probes]]
n = 40
seed = 11

[[probes]]
n = 40
seed = 23
