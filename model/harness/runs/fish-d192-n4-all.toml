# Fish size sweep: 192 wide, 4 deep (1.78M), loss on every token.
# Same dataset, seeds, iterations and training settings for every size, so the rows compare with
# fish-14m-all. The probes are model/probe_fish.py's (POCKET_SCHEMA=4): n = 40 per panel, which
# gives 40 states for most cases of prompt_check.panel.

model = "fish-d192-n4"
dataset = "fish-v4"
iters = 5000
batch = 64
lr = 6e-4
seeds = [1337, 1, 2]
mode = "training"
cpu = false
export = true

[[probes]]
n = 40
seed = 11

[[probes]]
n = 40
seed = 23
