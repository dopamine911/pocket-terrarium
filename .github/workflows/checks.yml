name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a newer run on the same branch or PR makes the older one pointless
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The simulator's selftests, one job per board and world (docs/BOARDS.md; sim/Makefile WORLD): they run side by side instead of
  # one after the other (`make check-all` is the same set, for a developer's machine). Each job builds its own bin and runs
  # `check` and `check-net`; none shares a build directory.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        world: [terrarium, aquarium]
        board: [rect, round, watch, square]
    name: sim ${{ matrix.world }} ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git sim/lvgl
      - name: Build and test the simulator
        run: |
          case "${{ matrix.board }}" in
            rect) flags= ;; round) flags=ROUND=1 ;; watch) flags=WATCH=1 ;; square) flags=SQUARE=1 ;;
          esac
          # model/out's two models are tracked: the inference selftests must run, so a missing one fails the job rather than skipping them
          for m in model_q4.bin model_q4_lizard.bin; do [ -f "model/out/$m" ] || { echo "::error::model/out/$m is missing: the inference selftests would be skipped"; exit 1; }; done
          make -C sim -j"$(nproc)" WORLD=${{ matrix.world }} $flags check check-net

  # The shipped configuration: every image leaves the card library off (CONFIG_POCKET_TANK_CARD, docs/card-library.md), so its pack pools,
  # its ADVANCED page and its tests are what they were before the library. The legs above build with the library on (sim/Makefile CARD=1).
  sim-nocard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        world: [terrarium, aquarium]
    name: sim ${{ matrix.world }} no card library
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git sim/lvgl
      - name: Build and test the simulator without the card library
        run: |
          for m in model_q4.bin model_q4_lizard.bin; do [ -f "model/out/$m" ] || { echo "::error::model/out/$m is missing: the inference selftests would be skipped"; exit 1; }; done
          make -C sim -j"$(nproc)" WORLD=${{ matrix.world }} CARD=0 check

  # what a release image carries (sim/release_check.c: one world's packs, its own capabilities): the common sources only
  release-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git sim/lvgl
      - name: Check the release images' packs
        run: make -C sim -j"$(nproc)" check-release

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the audio mixer
        working-directory: firmware/host_test
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../../common \
            -o audio_host audio_host.c ../../common/audio.c ../../common/sounds.c
          ./audio_host
      - name: Compare batched and sequential inference
        if: hashFiles('model/out/model_q4.bin') != ''
        working-directory: firmware/host_test
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../../common/llm \
            -o q4_host q4_host.c ../../common/llm/q4_model.c ../../common/llm/word_tok.c -lm
          ./q4_host ../../model/out/model_q4.bin ../../model/out/tokenizer.bin \
            "zone 2 hunger 7 energy 5 stress 2 curiosity 8 bold 4 social 6 stage adult trust 6 bored 3 food near 12 friend mid 3 bubble mid 10 reef far 7 wall clear last explore time day ->"
      - name: Check Python syntax
        run: python3 -m compileall -q tools model
